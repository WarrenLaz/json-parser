name: 01-buidling-blocks

on: push

jobs:
    echo-hello:
        runs-on: ubuntu-latest
        steps:
            - name: Say hi
              run: echo "Hello world!"
    echo-goodbye:
        runs-on: ubuntu-latest
        steps:
            - name: failed
              run: |
                echo "failed"
                exit 1
            - name: Say goodbye
              run: echo "GoodBye!"